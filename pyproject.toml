[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-street"
version = "0.1.0"
description = "Axiom Street — Honest quantitative research workbench"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.0,<0.129",
  "uvicorn[standard]>=0.32.0,<0.40",
  "pydantic>=2.9.0,<3",
  "pydantic-settings>=2.6.0,<3",
  "sqlalchemy>=2.0.36,<3",
  "alembic>=1.13.0,<1.16",
  "psycopg[binary]>=3.1.0,<4",
  "redis>=5.0.0,<7.1",
  "celery[redis]>=5.4.0,<6",
  "httpx>=0.27.0,<0.29",
  "pandas>=2.2.0,<3",
  "numpy>=1.26.0,<3",
  "pyarrow>=14.0.0,<20",
  "duckdb>=0.10.0,<1.3",
  "yfinance>=0.2.40",
  "python-multipart>=0.0.9",
  "sse-starlette>=2.1.0,<3",
  "orjson>=3.10.0",
  "eval_type_backport>=0.2.0",
  "structlog>=24.4.0,<26",
  "jedi>=0.19.0,<0.21",
  "reportlab>=4.2.0,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.28.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["quant*", "services*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "golden: requires Docker and pinned LEAN image (dual-source Polygon golden skips without POLYGON_API_KEY)",
  "integration: requires running postgres/redis",
]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W"]
ignore = ["E501"]

[tool.coverage.run]
source = ["quant"]
omit = ["quant/strategy_sdk/*"]

[tool.coverage.report]
fail_under = 0
show_missing = true

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
pretty = true
exclude = ["alembic/versions"]
