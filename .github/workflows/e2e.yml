name: E2E (on-demand full stack)

# The three critical-path E2E specs drive real backtests (LEAN via Docker),
# validation scans, and vendor market ingest. They need the full compose stack
# plus Docker + vendor connectivity, so they run ONLY on demand — a manual run
# or a PR labelled `e2e` — and never block the normal CI (`ci.yml`).

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

jobs:
  e2e:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Start compose stack (postgres, redis, api, worker)
        # Credentials are required since compose no longer defaults to street:street (EB-P5).
        env:
          POSTGRES_USER: street
          POSTGRES_PASSWORD: street-e2e-${{ github.run_id }}
          POSTGRES_DB: street
        run: docker compose up -d --build postgres redis api worker

      - name: Wait for API health
        run: |
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:8000/health >/dev/null; then exit 0; fi
            sleep 5
          done
          echo "API did not become healthy"
          docker compose logs --tail 150 api
          exit 1

      - name: Ingest SPY and QQQ market data via API
        run: |
          python3 - <<'EOF'
          import json, time, urllib.request

          def start_job(symbols: list[str]) -> str:
              req = urllib.request.Request(
                  "http://localhost:8000/api/v1/data/ingest",
                  data=json.dumps({
                      "symbols": symbols,
                      "mode": "full",
                      "provider": "auto",
                      "convert_lean": True,
                  }).encode(),
                  headers={"Content-Type": "application/json"},
              )
              with urllib.request.urlopen(req) as res:
                  return json.load(res)["id"]

          def wait_job(job_id: str) -> None:
              for _ in range(180):
                  with urllib.request.urlopen(f"http://localhost:8000/api/v1/data/ingest/{job_id}") as res:
                      status = json.load(res)["status"]
                  if status in ("COMPLETED", "FAILED", "CANCELLED"):
                      if status != "COMPLETED":
                          raise SystemExit(f"ingest job {job_id} ended {status}")
                      return
                  time.sleep(5)
              raise SystemExit(f"ingest job {job_id} timed out")

          for symbols in (["SPY"], ["QQQ"]):
              wait_job(start_job(symbols))
          print("market data ready")
          EOF

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web deps
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run E2E critical paths
        working-directory: apps/web
        run: npm run e2e
        env:
          API_BASE_URL: http://localhost:8000

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

      - name: Surface backend logs
        if: failure()
        run: docker compose logs --tail 200 api worker

      - name: Tear down stack
        if: always()
        run: docker compose down -v
