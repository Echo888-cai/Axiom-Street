services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-axiom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-axiom}
      POSTGRES_DB: ${POSTGRES_DB:-axiom}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-axiom} -d ${POSTGRES_DB:-axiom}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    environment:
      AXIOM_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-axiom}:${POSTGRES_PASSWORD:-axiom}@postgres:5432/${POSTGRES_DB:-axiom}
      AXIOM_REDIS_URL: redis://redis:6379/0
      AXIOM_CELERY_BROKER_URL: redis://redis:6379/0
      AXIOM_CELERY_RESULT_BACKEND: redis://redis:6379/1
      AXIOM_DATA_ROOT: /data
      AXIOM_JOBS_ROOT: /jobs
      AXIOM_LEAN_IMAGE: quantconnect/lean:16355
      AXIOM_CORS_ORIGINS: http://localhost:3000
      AXIOM_SYNC_BACKTESTS: "false"
      AXIOM_MAX_INFLIGHT_BACKTESTS: "2"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - ./jobs:/jobs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    command: celery -A services.worker.celery_app worker --beat --loglevel=INFO --concurrency=2
    environment:
      AXIOM_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-axiom}:${POSTGRES_PASSWORD:-axiom}@postgres:5432/${POSTGRES_DB:-axiom}
      AXIOM_REDIS_URL: redis://redis:6379/0
      AXIOM_CELERY_BROKER_URL: redis://redis:6379/0
      AXIOM_CELERY_RESULT_BACKEND: redis://redis:6379/1
      AXIOM_DATA_ROOT: "${PWD}/data"
      AXIOM_JOBS_ROOT: "${PWD}/jobs"
      AXIOM_LEAN_IMAGE: quantconnect/lean:16355
      AXIOM_WORKER_CONCURRENCY: "2"
      AXIOM_LEAN_TIMEOUT_SECONDS: "1800"
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      # Bind the host paths at the same location so `docker run -v` from the
      # worker can see job files (Docker daemon resolves paths on the host/VM).
      - "${PWD}/data:${PWD}/data"
      - "${PWD}/jobs:${PWD}/jobs"
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A services.worker.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
