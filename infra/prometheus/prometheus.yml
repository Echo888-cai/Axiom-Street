# Minimal scrape config for the Axiom Street API metrics (EB-P5).
# The API /metrics aggregates HTTP latency, Celery queue depth (Redis broker)
# and worker heartbeat age, so a single target is sufficient.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: axiom-street-api
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics
